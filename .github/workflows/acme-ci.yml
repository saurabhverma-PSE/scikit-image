
name: Acme - First Contribution CI

on:
  pull_request:
    branches:
      - poc/first-contribution-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,test]" "ruff==0.16.3" "matplotlib>=3.10"

      - name: Check lint
        run: |
          ruff check .

      - name: Check formatting
        run: |
          # Markdown is excluded because 4 existing docs fail and are left as is.
          # --extend-exclude keeps Ruff's default excludes; --exclude would drop them.
          ruff format --check --extend-exclude '*.md' .

      # Fixed regression suite for ACME-142. It is not selected from the PR's
      # changes and does not validate other behavior.
      - name: Run ACME-142 regression tests
        run: |
          python -m pytest -q tests/skimage/filters/test_thresholding.py tests/skimage2/filters/test_thresholding.py tests/skimage/test_migration.py

      - name: Record validation scope
        if: always()
        run: |
          {
            echo "### Validation scope (see step results for pass/fail)"
            echo "**Checked**"
            echo "- Ruff lint and format: non-ignored Python files in the checked-out code, using its own Ruff config"
            echo "- Tests: ACME-142 regression files only"
            echo ""
            echo "**Not checked**"
            echo "- Behavior of Python changes outside ACME-142"
            echo "- Full test suite, other platforms or Python versions, doctests, docs build, typing"
            echo "- Markdown formatting, including Python code blocks in Markdown"
            echo "- Cython files (.pyx)"
          } >> "$GITHUB_STEP_SUMMARY"
