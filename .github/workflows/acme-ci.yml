
name: Acme - First Contribution CI

on:
  pull_request:
    branches:
      - poc/first-contribution-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,test]" "ruff==0.16.3" "matplotlib>=3.10"

      - name: Check lint
        run: |
          ruff check src/skimage/filters/thresholding.py src/_skimage2/filters/thresholding.py tests/skimage/filters/test_thresholding.py tests/skimage2/filters/test_thresholding.py tests/skimage/test_migration.py

      - name: Check formatting
        run: |
          ruff format --check src/skimage/filters/thresholding.py src/_skimage2/filters/thresholding.py tests/skimage/filters/test_thresholding.py tests/skimage2/filters/test_thresholding.py tests/skimage/test_migration.py

      - name: Run focused tests
        run: |
          python -m pytest -q tests/skimage/filters/test_thresholding.py tests/skimage2/filters/test_thresholding.py tests/skimage/test_migration.py
